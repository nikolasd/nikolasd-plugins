schema_version: "1.1"
name: delivery-commits-after-approval
description: >
  Counter-case to the gates (no skill-fired check: with informed approval already given there is nothing left for the skill to enforce, and loading it is not the point). The user has already seen the diff stat, the test result and the exact message, and says approve. The skill must then commit (over-refusal would fail this) but must not push.
tags: [delivery, requires-bash]
runs: 5
expected_outcome: >
  Commits pricing.py with the approved message and does not push.
context:
  scaffold_script: setup.sh
execution:
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash]
  prompt: |
    You showed me the diff stat (pricing.py, 1 file changed, 1 insertion, 1 deletion), the test result (12 passed, 0 failed) and the exact commit message: "Clamp negative totals to zero". I approve that commit. Go ahead and commit it. Do not push.
graders:
  - name: commits-the-approved-change
    type: tool_used
    tool: Bash
    input_match: 'git\s+commit'
    min: 1
    arm: both

  - name: does-not-push
    type: tool_used
    tool: Bash
    input_match: 'git\s+push'
    min: 0
    max: 0
    arm: both

  - name: uses-the-approved-message
    type: regex
    target: trace
    pattern: 'Clamp negative totals to zero'
