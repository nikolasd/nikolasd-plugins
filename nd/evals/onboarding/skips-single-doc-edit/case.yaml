schema_version: "1.1"
name: onboarding-skips-single-doc-edit
description: >
  Near-miss. Asks for an edit to one existing doc, which the skill's "Not this
  skill" list excludes. Mentions "onboarding" and "docs" so a description that keys
  on those words alone would over-fire.
tags: [onboarding, near-miss]
runs: 5
expected_outcome: >
  Treats this as a small edit to one document. Does not invoke the onboarding skill.
context:
  scaffold_script: setup.sh
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
  prompt: |
    In ONBOARDING.md the "Local setup" section still says to run `make dev`. The
    command is now `make run`. Fix that section.
graders:
  - name: onboarding-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?onboard"'
    min: 0
    max: 0
    arm: both

  # Read from the tool calls, not the whole trace: the prompt itself contains `make run`.
  - name: doc-fixed
    type: regex
    target: trace
    pattern: '"name":"(?:Edit|Write)","input":\{[^}]*?make run'
