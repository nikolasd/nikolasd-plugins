schema_version: "1.1"
name: onboarding-fires-on-onboarding-request
description: >
  Trigger. Natural phrasing for a code-grounded onboarding doc set, with no skill
  name and none of the description's exact words. The skill should load. No scaffold
  and a short turn budget: the case only asserts the skill loads, not that the
  doc set gets built.
tags: [onboarding]
runs: 5
expected_outcome: >
  Loads the onboarding skill.
execution:
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    We just hired two engineers. I want a proper set of architecture and onboarding
    docs for this repo that they can rely on, built from what the code actually does,
    not from whatever the README says.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?onboard"'
