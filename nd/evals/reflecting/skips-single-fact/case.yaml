schema_version: "1.1"
name: reflecting-skips-single-fact
description: >
  Near-miss. The skill's own description excludes single-fact capture and says to
  call the basic-memory MCP directly. Guards the negative scope.
tags: [reflecting, near-miss]
runs: 5
expected_outcome: >
  Captures the one fact directly without running the session-reflection workflow.
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    Remember that this repo uses pnpm, not npm — npm install corrupts the lockfile.
graders:
  - name: reflecting-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:reflect|reflecting)"'
    min: 0
    max: 0
    arm: both

  - name: no-session-review
    type: llm
    criteria: |
      The user asked to remember one fact.

      PASS if the response captures or offers to capture that single fact.

      FAIL if the response starts a session-wide review: enumerating learnings across
      the conversation, classifying items into tiers, or presenting a table of notes
      to approve.
