schema_version: "1.1"
name: handoff-skips-compact-conversation
description: >
  Near-miss. The user wants the conversation compacted in place and plans to keep working here. A HANDOFF.md for a new session is the wrong deliverable (that is /compact or a plain summary).
tags: [handoff, near-miss]
runs: 5
expected_outcome: >
  Summarises in the reply. Does not invoke the handoff skill or write a file.
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Compact this conversation so far into a short summary so I can keep going here.
graders:
  - name: handoff-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:handoff)"'
    min: 0
    max: 0
    arm: both
