schema_version: "1.1"
name: plain-language-explains-plainly
description: >
  The primary trigger after the rewrite to a request-scoped skill. Checks the recipe
  actually lands: everyday words, short sentences, load-bearing terms defined.
tags: [plain-language]
runs: 5
expected_outcome: >
  Explains a message queue without filler jargon, in short sentences, defining any
  technical term it keeps.
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Explain what a message queue is and why I'd want one. Plain language please, I'm
    not an engineer.
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plain-language"'

  - name: no-filler-jargon
    type: regex
    pattern: '\b(utilize|leverage|facilitate|robust solution)\b'
    flags: i
    match: not_contains
    arm: both

  - name: readable-first-pass
    type: llm
    weight: 2
    criteria: |
      The reader has said they are not an engineer. Judge only these three tests.

      Test 1: no bullet opens with a technical term used as a label and followed by a dash
      or colon (for example "Decoupling - ..."). A bullet that opens with a plain-English
      sentence, even in bold, passes this test.
      Test 2: none of "decoupling", "throughput", "asynchronous", "backpressure",
      "idempotent", "fan-out" appears without being explained where it first appears.
      Naming real products as examples (for example RabbitMQ or Kafka) is fine.
      Test 3: sentences are mostly short; a few longer ones are fine.

      PASS if all three tests pass.

      FAIL if any test fails. Ignore length, headings, analogies and formatting choices.
