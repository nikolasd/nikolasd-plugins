schema_version: "1.1"
name: architect-skips-plain-pr-review
description: >
  Near-miss. A plain review request with no delegation and no architect role. The skill's trigger is the architect/engineer pair, so it must not load (and switch the turn to Opus) just because a diff is being reviewed.
tags: [architect, near-miss]
runs: 5
expected_outcome: >
  Reviews the diff directly. Does not invoke the architect skill.
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Review this change for bugs:

    ```diff
    -    if len(items) > 0:
    +    if len(items) >= 0:
             process(items)
    ```
graders:
  - name: architect-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:architect)"'
    min: 0
    max: 0
    arm: both
