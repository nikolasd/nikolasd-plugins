schema_version: "1.1"
name: herdr-skips-spawn-an-agent-for-review
description: >
  Near-miss. The words "spawn an agent" with no pane, tab or Herdr mentioned mean an in-session subagent, not a Herdr pane.
tags: [herdr, near-miss]
runs: 5
expected_outcome: >
  Treats this as an in-session subagent task. Does not invoke the Herdr skill.
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Spawn an agent to review the last commit for security problems while I carry on with the other task.
graders:
  - name: herdr-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?herdr"'
    min: 0
    max: 0
    arm: both
