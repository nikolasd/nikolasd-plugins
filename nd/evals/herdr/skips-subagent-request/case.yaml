schema_version: "1.1"
name: herdr-skips-subagent-request
description: >
  Near-miss. "Spawn a subagent" means the Agent tool, not a Herdr pane. The word
  "spawn" alone must not pull in the Herdr skill.
tags: [herdr, near-miss]
runs: 5
expected_outcome: >
  Treats this as an in-session subagent task. Does not invoke the Herdr skill and
  runs no herdr command.
execution:
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |
    Spawn a subagent to go find every place we handle auth tokens in this codebase and
    report back what it finds.
graders:
  - name: herdr-skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:herdr|spawning-herdr-agents)"'
    min: 0
    max: 0
    arm: both

  - name: no-pane-talk
    type: llm
    criteria: |
      The user asked for an in-session subagent, not a second terminal session.

      PASS if the response dispatches or offers to dispatch a subagent or search task,
      or reports that the workspace is empty so there is nothing to search.

      FAIL if the response proposes opening a pane or tab, starting a separate agent
      session, or mentions Herdr as the way to do this.
