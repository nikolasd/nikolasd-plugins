schema_version: "1.1"
name: specs-from-prd-dry-run-writes-nothing
description: >
  With --dry-run the skill drafts and checks the document but writes no file, and says how to proceed.
tags: [specs-from-prd, guard, requires-bash]
runs: 3
expected_outcome: >
  Shows the full draft after running the checker, says nothing was written, and offers to write it on confirmation or to re-run without --dry-run.
context:
  scaffold_script: setup.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Agent]
  prompt: |
    /pm:specs-from-prd prd/exports.md --dry-run
    Answers to your interview, so do not ask me anything: the audience is customers on the account page, success is fewer support tickets, no more detail. Show me the draft.
graders:
  - name: writes-no-file
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*specs-from-prd-draft-)'
    min: 0
    max: 0
    arm: both

  - name: ran-the-checker
    type: tool_used
    tool: Bash
    input_match: '(\bpython3?|\bpy -3|\buv run[^|;&]*\bpython)(\s+-\S+)*\s+\S*check_specs\.py'
    min: 1

  - name: shows-the-draft-and-says-nothing-was-written
    type: llm
    weight: 2
    criteria: |
      The user ran the skill with --dry-run.

      PASS if the assistant shows a complete specs draft (more than a summary), says nothing was
      written to disk, and tells the user how to proceed (confirm in the conversation, or run again
      without --dry-run).

      FAIL if it says it wrote the file, shows only a summary, or does not say how to proceed.

  - name: reports-the-checker-outcome
    type: llm
    criteria: |
      The skill runs a mechanical checker on the draft before showing it.

      PASS if the final message lets the user tell whether that check passed: it says the checker
      passed (or ran with no errors), or it says plainly that the mechanical check did not run and
      that its rules were applied by hand.

      FAIL if it implies the draft was checked when the checker failed to run, or says nothing at
      all about the check.
