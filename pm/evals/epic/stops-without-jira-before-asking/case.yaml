schema_version: "1.1"
name: epic-stops-without-jira-before-asking
description: >
  Guard. The skill checks the Jira project before it starts the Q&A. With no Atlassian MCP it must stop at that check and say so, rather than run the whole interview and fail at the final write.
tags: [epic, guard]
runs: 3
expected_outcome: >
  Says the Atlassian MCP is not available, asks no interview questions, writes nothing, and does not claim to have checked the project or created an Epic.
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Write, Bash]
  prompt: |
    /pm:epic
    Use project DEMO and a standard single delivery. My requirements document is pasted below, please use it.

    PRD: Self-service membership refresh.
    Problem: group membership changes can take up to a day to appear in the membership
    service because cached results expire only at midnight. Support handles 15 tickets a
    week about this.
    Goal: a support administrator can see a membership change reflected within 5 minutes
    without asking engineering.
    In scope: a configurable cache lifetime; an admin action to force a refresh for one user.
    Out of scope: bulk imports, changes to the identity provider.
    Success: support tickets about stale membership fall by 80 percent within two months; no
    rise in identity provider load.
    Risks: more load on the identity provider; depends on the platform team exposing a
    per-user lookup API.
graders:
  - name: no-createjiraissue
    type: tool_used
    tool: mcp__atlassian__createJiraIssue
    min: 0
    max: 0
    arm: both

  - name: says-jira-is-unavailable
    type: llm
    weight: 2
    criteria: |
      PASS if the assistant says it cannot continue because the Atlassian MCP is not
      available in this session (or that it could not check the Jira project), and stops.

      FAIL if it carries on with the interview as if Jira were available, or claims the
      project was checked or an Epic created.

  - name: does-not-start-the-interview
    type: llm
    criteria: |
      PASS if the assistant asks no requirements questions (objective, scope, success
      criteria, risks) and does not draft Epic sections. Mentioning that it will use the
      pasted PRD once Jira is available is fine.

      FAIL if it starts the interview or drafts any Epic section.
