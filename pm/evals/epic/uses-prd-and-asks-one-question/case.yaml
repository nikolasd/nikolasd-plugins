schema_version: "1.1"
name: epic-uses-prd-and-asks-one-question
description: >
  Applied. Given a pasted PRD, the skill must use it as a source and confirm with the user, not re-ask every section from scratch, and must not ask technical questions.
tags: [epic, applied]
runs: 3
expected_outcome: >
  Summarises the PRD, proposes the first section from it, and asks one business question. No technical questions. No Jira write.
execution:
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Write, Bash]
  prompt: |
    /pm:epic
    Use project DEMO and a standard single delivery. My requirements document is pasted below, please use it.

    PRD: Self-service membership refresh.
    Problem: group membership changes can take up to a day to appear in the membership
    service because cached results expire only at midnight. Support handles 15 tickets a
    week about this.
    Goal: a support administrator can see a membership change reflected within 5 minutes
    without asking engineering.
    In scope: a configurable cache lifetime; an admin action to force a refresh for one user.
    Out of scope: bulk imports, changes to the identity provider.
    Success: support tickets about stale membership fall by 80 percent within two months; no
    rise in identity provider load.
    Risks: more load on the identity provider; depends on the platform team exposing a
    per-user lookup API.
graders:
  - name: no-createjiraissue
    type: tool_used
    tool: mcp__atlassian__createJiraIssue
    min: 0
    max: 0
    arm: both

  - name: uses-the-document
    type: llm
    weight: 2
    criteria: |
      PASS if the assistant summarises the pasted PRD and proposes content for the first
      section (for example the Epic name) drawn from it, naming the PRD as the source, and
      asks the user to confirm, amend or replace it.

      FAIL if it ignores the PRD and asks an open question from scratch, or treats PRD
      content as already confirmed.

  - name: business-questions-only
    type: llm
    criteria: |
      PASS if every question to the user is about the business (purpose, scope, success,
      risks, delivery).

      FAIL if it asks about frameworks, databases, APIs, architecture or other technical
      choices.

  - name: one-question-at-a-time
    type: llm
    criteria: |
      PASS if the final message poses a single question to the user (numbered options for
      that question are fine).

      FAIL if it asks several separate questions in one message.
