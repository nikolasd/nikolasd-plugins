name: Validate plugin manifests

# Manifest/schema validation only - no Claude API credentials involved. This
# deliberately does NOT run `claude plugin eval` (see CONTRIBUTING.md and
# nd/evals/README.md for why that stays a manual, machine-dependent step).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Add claude to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      - name: Validate nd plugin
        run: claude plugin validate nd --strict

      - name: Validate pm plugin
        run: claude plugin validate pm --strict

      - name: Test pm configuration loader
        run: sh pm/tests/test-config.sh

      - name: Test pm repository-context script
        run: sh pm/tests/test-repo-context.sh

      - name: Check every pm skill loads the configuration
        run: |
          status=0
          q="'"
          inject="!\`sh \${CLAUDE_PLUGIN_ROOT}/scripts/config.sh ${q}\${user_config.site}${q}\`"
          for f in pm/skills/*/SKILL.md; do
            grep -Fxq -- "$inject" "$f" \
              || { echo "$f: missing the exact configuration injection line"; status=1; }
            grep -Fq '"Bash(sh ${CLAUDE_PLUGIN_ROOT}/scripts/config.sh *)"' "$f" \
              || { echo "$f: no allowed-tools rule for config.sh"; status=1; }
            ! grep -q 'points_scale' "$f" \
              || { echo "$f: still mentions the removed points_scale option"; status=1; }
          done
          exit "$status"

      - name: Validate ty-lsp plugin
        run: claude plugin validate ty-lsp --strict
